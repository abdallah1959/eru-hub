name = "eru-hub-api"
main = "src/index.js"
compatibility_date = "2026-10-16"

# Add your real D1 database ID after creating the database in Cloudflare.
# Do not deploy until the database binding and required secrets are configured.
[[d1_databases]]
binding = "DB"
database_name = "eru-hub"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"
