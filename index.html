.wrap{max-width:1020px;margin:0 auto;padding:20px 20px 40px}
.bar{display:flex;justify-content:flex-end}
.lang{font:inherit;font-weight:700;font-size:.92rem;color:#fff;cursor:pointer;padding:7px 18px;border-radius:99px;background:var(--g);border:1px solid var(--gb);backdrop-filter:blur(12px);transition:.2s}
.lang:hover{background:rgba(255,255,255,.22)}
header{text-align:center;padding:6px 0 10px}
.logo{width:120px;height:120px;border-radius:50%;background:#fff;padding:5px;object-fit:cover;box-shadow:0 14px 40px rgba(0,0,0,.5),0 0 0 5px rgba(255,255,255,.2)}
h1{font-size:clamp(1.8rem,5vw,2.8rem);line-height:1.3;margin:18px 0 6px;font-weight:800}
.sub{color:var(--soft);font-size:1.05rem}
.date{display:inline-block;margin-top:14px;padding:4px 16px;border-radius:99px;background:var(--g);border:1px solid var(--gb);backdrop-filter:blur(10px);font-size:.88rem;color:var(--soft)}
h2{font-size:1.25rem;font-weight:800;margin:38px 0 16px;padding-inline-start:12px;border-inline-start:4px solid var(--red)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,285px),1fr));gap:18px;align-items:stretch}
.tile{min-width:0;min-height:100%}
.name,.desc{overflow-wrap:anywhere}
.acts .btn{min-width:0;min-height:44px;padding-inline:8px}
.btn:focus-visible,.lang:focus-visible,.x:focus-visible{outline:3px solid #fff;outline-offset:3px}
img{max-width:100%}
.tile{display:flex;flex-direction:column;gap:10px;padding:14px 14px 18px;border-radius:22px;background:var(--g);border:1.5px solid var(--gb);backdrop-filter:blur(16px);transition:transform .2s,border-color .2s,background .2s}
.tile:hover{transform:translateY(-4px);background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.45)}
.panel{height:144px;border-radius:16px;background:#fff;display:flex;align-items:center;justify-content:center;padding:10px;overflow:hidden}
.panel img{height:122px;width:auto;max-width:100%;object-fit:contain;display:block}
.panel.round img{width:112px;height:112px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 4px #e8ecf6}
.panel.dark{background:linear-gradient(135deg,#13224f,#1d3a8a)}
.panel.dark img{height:116px}
.badge{align-self:flex-start;font-size:.78rem;font-weight:700;padding:1px 12px;border-radius:99px;background:rgba(255,255,255,.16);margin-top:4px;margin-inline:6px}
.name{font-weight:800;font-size:1.15rem;line-height:1.4;padding-inline:6px}
.desc{color:var(--soft);font-size:.92rem;flex:1;padding-inline:6px}
.host{color:#9fb0e0;font-size:.78rem;direction:ltr;unicode-bidi:plaintext;text-align:start;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-inline:6px}
html[dir=rtl] .host{text-align:right}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-inline:4px;margin-top:4px}
.btn{white-space:nowrap;font:inherit;font-weight:700;border:0;border-radius:13px;padding:10px 12px;cursor:pointer;color:#fff;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:.2s}
.btn:hover{transform:translateY(-1px);filter:brightness(1.1)}
.open{grid-column:1/-1;background:linear-gradient(135deg,var(--red),var(--red2));box-shadow:0 6px 18px rgba(196,18,31,.35)}
.wa .open{background:linear-gradient(135deg,#0f8a43,#27c46a);box-shadow:0 6px 18px rgba(22,163,74,.35)}
.ghost{background:rgba(255,255,255,.14);border:1px solid var(--gb)}
.credit{margin-top:8px;font-size:.92rem;color:var(--soft)}.credit strong{color:#fff;font-weight:800;letter-spacing:.2px;direction:ltr;unicode-bidi:isolate}
footer{text-align:center;margin-top:46px;padding-top:18px;border-top:1px solid var(--gb);color:#a9b8e3;font-size:.85rem}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:0 auto 22px;max-width:540px;text-align:center}
.stat{min-width:0;padding:16px 12px;border:1px solid rgba(255,255,255,.2);border-radius:18px;background:linear-gradient(145deg,rgba(255,255,255,.11),rgba(11,21,53,.58));box-shadow:0 10px 28px rgba(0,0,0,.16);backdrop-filter:blur(14px)}
.stat-icon{display:block;font-size:1.25rem;margin-bottom:4px}
.stat-value{display:block;font-size:clamp(1.45rem,4vw,2rem);font-weight:800;line-height:1.3;color:#fff;font-variant-numeric:tabular-nums;direction:ltr}
.stat-label{display:block;margin-top:5px;color:var(--soft);font-size:.82rem;font-weight:700}
.stat-note{margin-top:8px;font-size:.7rem;color:#91a2d2}
@media(max-width:420px){.stats{gap:8px}.stat{padding:13px 7px;border-radius:15px}.stat-label{font-size:.75rem}}
dialog{margin:auto;border:0;border-radius:24px;padding:0;background:transparent;color:#fff;width:min(420px,calc(100vw - 24px));max-width:calc(100vw - 24px);max-height:calc(100dvh - 24px);overflow:auto}
dialog::backdrop{background:rgba(5,9,26,.72);backdrop-filter:blur(6px)}
.modal{width:100%;max-height:calc(100dvh - 24px);overflow:auto}
.modal{width:100%;max-height:calc(100dvh - 24px);overflow:auto;padding:24px;border-radius:24px;background:linear-gradient(160deg,#16275a,#0c1637);border:1.5px solid var(--gb);box-shadow:0 30px 80px rgba(0,0,0,.6);text-align:center;position:relative}
.modal h3{font-size:1.15rem;font-weight:800;margin:0 28px 4px}
.modal p{color:var(--soft);font-size:.88rem;margin-bottom:14px}
.qrbox{background:#fff;border-radius:18px;padding:12px;display:inline-block}
.qrbox canvas{display:block;width:min(260px,66vw);height:auto;image-rendering:pixelated}
.x{position:absolute;top:12px;inset-inline-end:14px;width:34px;height:34px;border-radius:50%;border:1px solid var(--gb);background:var(--g);color:#fff;font-size:1rem;cursor:pointer}
.dl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.dl .btn{background:linear-gradient(135deg,var(--red),var(--red2))}
.dl .btn.s{background:rgba(255,255,255,.14);border:1px solid var(--gb)}
.mh{color:#9fb0e0;font-size:.76rem;direction:ltr;margin-top:12px;word-break:break-all}
.toast{position:fixed;bottom:26px;left:50%;transform:translate(-50%,24px);opacity:0;visibility:hidden;background:#fff;color:#0a1330;font-weight:700;padding:11px 22px;border-radius:99px;box-shadow:0 12px 32px rgba(0,0,0,.45);transition:.3s;z-index:99;max-width:92vw;text-align:center}
.toast.show{opacity:1;visibility:visible;transform:translate(-50%,0)}
a:focus-visible,button:focus-visible{outline:3px solid #fff;outline-offset:2px}
@media (max-width:560px){
 .wrap{padding:16px 12px 32px}
 .logo{width:100px;height:100px}
 .grid{grid-template-columns:minmax(0,1fr);gap:14px}
 .tile{padding:12px 12px 16px;border-radius:18px}
 .panel{height:132px}
 .panel img{max-height:112px}
 .modal{padding:20px 16px}
 .qrbox{max-width:100%;padding:8px}
 .dl{gap:7px}
}
@media (max-width:350px){.acts{gap:6px}.btn{font-size:.85rem}.host{font-size:.7rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script data-goatcounter="https://eru-ai-student-hub.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
<script>
(() => {
  const endpoint = "https://eru-ai-student-hub.goatcounter.com/counter//eru-hub.json";
  const getElement = id => document.getElementById(id);

  function cairoDate() {
    const parts = new Intl.DateTimeFormat("en-CA", {
      timeZone: "Africa/Cairo",
      year: "numeric",
      month: "2-digit",
      day: "2-digit"
    }).formatToParts(new Date());
    const part = type => parts.find(item => item.type === type)?.value;
    return `${part("year")}-${part("month")}-${part("day")}`;
  }

  function formatCount(raw) {
    // GoatCounter returns count as a formatted string; normalize it for locale formatting.
    const parsed = Number(String(raw ?? "").replace(/[^0-9.-]/g, ""));
    if (!Number.isFinite(parsed)) throw new Error("GoatCounter returned an invalid count");
    return parsed.toLocaleString(document.documentElement.lang === "ar" ? "ar-EG" : "en-GB");
  }

  async function fetchCount(url) {
    // Use only documented GoatCounter query parameters. Browser cache is disabled;
    // GoatCounter may still cache public counter responses for up to four hours.
    const response = await fetch(url, {
      cache: "no-store",
      headers: { Accept: "application/json" }
    });
    if (!response.ok) throw new Error(`GoatCounter request failed (${response.status})`);
    const data = await response.json();
    if (data.count === undefined || data.count === null) {
      throw new Error("GoatCounter response did not include count");
    }
    return formatCount(data.count);
  }

  async function updateOne(id, url) {
    const element = getElement(id);
    if (!element) return;
    try {
      const count = await fetchCount(url);
      // The footer is recreated when switching languages, so always look up the element
      // again after the network request completes.
      const current = getElement(id);
      if (current) {
        current.textContent = count;
        current.removeAttribute("title");
        current.setAttribute("aria-label", count);
      }
    } catch (error) {
      console.warn(`[ERU Hub] Unable to load ${id} from GoatCounter:`, error);
      const current = getElement(id);
      if (current) current.title = "تعذر تحميل الإحصائية؛ افتح Console لمعرفة التفاصيل";
    }
  }

  window.refreshVisitStats = function refreshVisitStats() {
    const today = cairoDate();
    const todayUrl = `${endpoint}?start=${encodeURIComponent(today)}&end=${encodeURIComponent(today)}`;
    void Promise.all([
      updateOne("visit-total", endpoint),
      updateOne("visit-today", todayUrl)
    ]);
  };

  // Initial load and language changes (render() calls this after rebuilding the footer).
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", window.refreshVisitStats, { once: true });
  } else {
    window.refreshVisitStats();
  }
})();
</script>
