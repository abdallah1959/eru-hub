name: Backend tests

on:
  push:
    branches:
      - feature/academic-hub-foundation
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node --check ../hub-features.js
      - run: python test/check_migrations.py
